  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>

  <text x="40" y="50" class="title" text-anchor="start">Attention patterns are visible as matrices</text>
  <text x="40" y="78" class="subtitle" text-anchor="start">Cross-attention, bidirectional self-attention, and causal self-attention use the same scoring idea with different masks.</text>
  <rect x="42" y="120" width="365" height="520" rx="20" fill="#fbfdff" stroke="#d0d7de" stroke-width="2" class="panel"/>
  <rect x="458" y="120" width="365" height="520" rx="20" fill="#fbfdff" stroke="#d0d7de" stroke-width="2" class="panel"/>
  <rect x="874" y="120" width="365" height="520" rx="20" fill="#fbfdff" stroke="#d0d7de" stroke-width="2" class="panel"/>
  <text x="224" y="164" class="label" text-anchor="middle">Cross-attention</text>
  <text x="640" y="164" class="label" text-anchor="middle">Self-attention</text>
  <text x="1056" y="164" class="label" text-anchor="middle">Causal self-attention</text>
  <text x="224" y="190" class="muted" text-anchor="middle">target queries source tokens</text>
  <text x="640" y="190" class="muted" text-anchor="middle">each token may read all tokens</text>
  <text x="1056" y="190" class="muted" text-anchor="middle">future positions are blocked</text>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img">
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0969da"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#8250df"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#1a7f37"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#bf8700"/>
    </marker>
    <linearGradient id="flow-blue-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969da"/>
      <stop offset="100%" stop-color="#8250df"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <style>
    .title { font: 700 28px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
    .subtitle { font: 500 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
    .label { font: 700 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
    .small { font: 600 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
    .muted { font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
    .mono { font: 700 13px "SFMono-Regular", Consolas, monospace; fill: #0f172a; }
    .panel { fill: #fbfdff; stroke: #d0d7de; stroke-width: 1.4; rx: 18; filter: url(#soft-shadow); }
    .thin { vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect x="0" y="0" width="1280" height="760" fill="#ffffff"/>

  <text x="40" y="50" class="title" text-anchor="start">From recurrent bottleneck to attention lookup</text>
  <text x="40" y="78" class="subtitle" text-anchor="start">The decoder stops relying on one compressed state and learns to read the relevant encoder states directly.</text>
  <rect x="44" y="120" width="520" height="560" rx="20" fill="#fbfdff" stroke="#d0d7de" stroke-width="2" class="panel"/>
  <rect x="716" y="120" width="520" height="560" rx="20" fill="#fbfdff" stroke="#d0d7de" stroke-width="2" class="panel"/>
  <text x="304" y="164" class="label" text-anchor="middle">RNN seq2seq bottleneck</text>
  <text x="976" y="164" class="label" text-anchor="middle">Attention bridge</text>
  <rect x="92" y="210" width="82" height="44" rx="10" fill="#eaf3ff" stroke="#0969da" stroke-width="2" />
<text x="133" y="238" class="small" text-anchor="middle">my</text><rect x="196" y="210" width="82" height="44" rx="10" fill="#eaf3ff" stroke="#0969da" stroke-width="2" />
<text x="237" y="238" class="small" text-anchor="middle">name</text><rect x="300" y="210" width="82" height="44" rx="10" fill="#eaf3ff" stroke="#0969da" stroke-width="2" />
<text x="341" y="238" class="small" text-anchor="middle">is</text><rect x="404" y="210" width="82" height="44" rx="10" fill="#eaf3ff" stroke="#0969da" stroke-width="2" />
<text x="445" y="238" class="small" text-anchor="middle">dinesh</text>
  <line x1="174" y1="232" x2="196" y2="232" stroke="#0969da" stroke-width="3" marker-end="url(#arrow-blue)" class="thin" />
  <line x1="278" y1="232" x2="300" y2="232" stroke="#0969da" stroke-width="3" marker-end="url(#arrow-blue)" class="thin" />
  <line x1="382" y1="232" x2="404" y2="232" stroke="#0969da" stroke-width="3" marker-end="url(#arrow-blue)" class="thin" />
  <rect x="180" y="326" width="250" height="74" rx="16" fill="#fff8e6" stroke="#bf8700" stroke-width="2" />
  <text x="305" y="354" class="label" text-anchor="middle">one final hidden vector</text>
<text x="305" y="374" class="label" text-anchor="middle">must carry every detail</text>
  <line x1="305" y1="254" x2="305" y2="326" stroke="#0969da" stroke-width="3" marker-end="url(#arrow-blue)" class="thin" />
  <rect x="205" y="508" width="200" height="72" rx="16" fill="#f3f8f1" stroke="#1a7f37" stroke-width="2" />
  <text x="305" y="538" class="label" text-anchor="middle">decoder tries to</text>
<text x="305" y="558" class="label" text-anchor="middle">recover details</text>
  <line x1="305" y1="400" x2="305" y2="508" stroke="#bf8700" stroke-width="3" marker-end="url(#arrow-orange)" class="thin" />
  <path d="M454 362 C590 350 620 264 740 254" fill="none" stroke="#cf222e" stroke-width="3" marker-end="url(#arrow-orange)" class="thin" stroke-dasharray="8 8"/>
  <text x="612" y="318" class="muted" text-anchor="middle">fragile long bridge</text>
  <rect x="770" y="248" width="78" height="42" rx="10" fill="#eaf3ff" stroke="#0969da" stroke-width="2" />
<text x="809" y="275" class="small" text-anchor="middle">h1</text><rect x="874" y="248" width="78" height="42" rx="10" fill="#eaf3ff" stroke="#0969da" stroke-width="2" />
<text x="913" y="275" class="small" text-anchor="middle">h2</text><rect x="978" y="248" width="78" height="42" rx="10" fill="#eaf3ff" stroke="#0969da" stroke-width="2" />
<text x="1017" y="275" class="small" text-anchor="middle">h3</text><rect x="1082" y="248" width="78" height="42" rx="10" fill="#eaf3ff" stroke="#0969da" stroke-width="2" />
<text x="1121" y="275" class="small" text-anchor="middle">h4</text>
  <rect x="855" y="410" width="260" height="78" rx="16" fill="#f5f0ff" stroke="#8250df" stroke-width="2" />
  <text x="985" y="440" class="label" text-anchor="middle">decoder query</text>
<text x="985" y="460" class="label" text-anchor="middle">what source info now?</text>
  <text x="828" y="516" class="muted" text-anchor="middle">h1</text>
<text x="882" y="516" class="muted" text-anchor="middle">h2</text>
<text x="936" y="516" class="muted" text-anchor="middle">h3</text>
<text x="990" y="516" class="muted" text-anchor="middle">h4</text>
<rect x="805" y="534" width="46" height="46" rx="6" fill="rgb(234,224,252)" stroke="#ffffff" stroke-width="1.5"/><text x="828" y="562" class="muted" text-anchor="middle">0.1</text>
<rect x="859" y="534" width="46" height="46" rx="6" fill="rgb(222,208,249)" stroke="#ffffff" stroke-width="1.5"/><text x="882" y="562" class="muted" text-anchor="middle">0.2</text>
<rect x="913" y="534" width="46" height="46" rx="6" fill="rgb(234,224,252)" stroke="#ffffff" stroke-width="1.5"/><text x="936" y="562" class="muted" text-anchor="middle">0.1</text>
<rect x="967" y="534" width="46" height="46" rx="6" fill="rgb(142,96,226)" stroke="#ffffff" stroke-width="1.5"/><text x="990" y="562" class="muted" text-anchor="middle">0.9</text>

  <text x="930" y="618" class="muted" text-anchor="middle">attention weights</text>
  <rect x="1050" y="548" width="130" height="54" rx="14" fill="#f3f8f1" stroke="#1a7f37" stroke-width="2" />
  <text x="1115" y="581" class="label" text-anchor="middle">context</text>
  <path d="M900 410 C850 350 810 320 808 290" fill="none" stroke="#8250df" stroke-width="3" marker-end="url(#arrow-purple)" class="thin" />
  <path d="M950 410 C928 350 925 318 912 290" fill="none" stroke="#8250df" stroke-width="3" marker-end="url(#arrow-purple)" class="thin" />
  <path d="M1000 410 C1030 350 1042 318 1016 290" fill="none" stroke="#8250df" stroke-width="3" marker-end="url(#arrow-purple)" class="thin" />
  <path d="M1080 410 C1150 350 1140 315 1120 290" fill="none" stroke="#8250df" stroke-width="4" marker-end="url(#arrow-purple)" class="thin" />
  <line x1="1000" y1="560" x2="1050" y2="575" stroke="#1a7f37" stroke-width="3" marker-end="url(#arrow-green)" class="thin" />
  <text x="976" y="690" class="subtitle" text-anchor="middle">The high weight on h4 means this decoder step can directly retrieve the source name state.</text>
  
</svg>

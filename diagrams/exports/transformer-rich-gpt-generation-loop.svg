<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img">
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0969da"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#8250df"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#1a7f37"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#bf8700"/>
    </marker>
    <linearGradient id="flow-blue-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969da"/>
      <stop offset="100%" stop-color="#8250df"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <style>
    .title { font: 700 28px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
    .subtitle { font: 500 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
    .label { font: 700 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
    .small { font: 600 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
    .muted { font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
    .mono { font: 700 13px "SFMono-Regular", Consolas, monospace; fill: #0f172a; }
    .panel { fill: #fbfdff; stroke: #d0d7de; stroke-width: 1.4; rx: 18; filter: url(#soft-shadow); }
    .thin { vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect x="0" y="0" width="1280" height="520" fill="#ffffff"/>

  <text x="40" y="50" class="title" text-anchor="start">GPT generation: predict, append, repeat</text>
  <text x="40" y="78" class="subtitle" text-anchor="start">Training can score all next-token targets under a causal mask; inference extends the prefix one token at a time.</text>
  <rect x="50" y="128" width="300" height="245" rx="20" fill="#fbfdff" stroke="#d0d7de" stroke-width="2" class="panel"/>

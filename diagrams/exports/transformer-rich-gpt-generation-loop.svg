<text x="1001.5483870967741" y="309" class="muted" text-anchor="start">0.05</text>
  <text x="1000" y="382" class="muted" text-anchor="middle">sample token, append to prefix</text>
  <line x1="350" y1="250" x2="448" y2="250" stroke="#0969da" stroke-width="4" marker-end="url(#arrow-blue)" class="thin" />
  <line x1="748" y1="250" x2="840" y2="250" stroke="#8250df" stroke-width="4" marker-end="url(#arrow-purple)" class="thin" />
  <path d="M1000 373 C930 505 355 505 345 260" fill="none" stroke="#1a7f37" stroke-width="3" marker-end="url(#arrow-green)" class="thin" />
  <text x="610" y="492" class="subtitle" text-anchor="middle">The generated token becomes part of the next input context.</text>
  
</svg>

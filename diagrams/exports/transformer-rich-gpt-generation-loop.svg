<text x="205" y="243" class="small" text-anchor="middle">name</text>
  <rect x="256" y="216" width="50" height="42" rx="10" fill="#eaf3ff" stroke="#0969da" stroke-width="2" />
<text x="281" y="243" class="small" text-anchor="middle">is</text>

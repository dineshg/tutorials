  <text x="200" y="432" class="muted" text-anchor="middle">causal mask for visible prefix</text>
  <rect x="448" y="128" width="300" height="245" rx="20" fill="#f5f0ff" stroke="#8250df" stroke-width="2" filter="url(#soft-shadow)"/>
  <text x="598" y="174" class="label" text-anchor="middle">Decoder-only Transformer</text>
  <text x="598" y="210" class="small" text-anchor="middle">masked self-attention</text>
<text x="598" y="238" class="small" text-anchor="middle">MLP blocks</text>
<text x="598" y="266" class="small" text-anchor="middle">last-position logits</text>
  <rect x="540" y="318" width="120" height="30" rx="10" fill="#ffffff" stroke="#8250df" stroke-width="2" /><rect x="560" y="308" width="120" height="30" rx="10" fill="#ffffff" stroke="#8250df" stroke-width="2" /><rect x="580" y="298" width="120" height="30" rx="10" fill="#ffffff" stroke="#8250df" stroke-width="2" /><rect x="600" y="288" width="120" height="30" rx="10" fill="#ffffff" stroke="#8250df" stroke-width="2" />
  <rect x="840" y="128" width="320" height="245" rx="20" fill="#fbfdff" stroke="#d0d7de" stroke-width="2" class="panel"/>
  <text x="1000" y="170" class="label" text-anchor="middle">Next-token distribution</text>
  <text x="900" y="226" class="mono" text-anchor="start">Dinesh</text>
<rect x="978" y="210" width="168" height="18" rx="7" fill="rgb(26,127,55)" stroke="#1a7f37" stroke-width="2" />
<text x="1156" y="225" class="muted" text-anchor="start">0.62</text>
<text x="900" y="254" class="mono" text-anchor="start">.</text>

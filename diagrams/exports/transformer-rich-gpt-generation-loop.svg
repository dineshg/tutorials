<rect x="202" y="300" width="34" height="34" rx="6" fill="#f1f5f9" stroke="#ffffff" stroke-width="1.5"/><path d="M210 308 L228 326 M228 308 L210 326" stroke="#cf222e" stroke-width="2" opacity=".55"/>
<rect x="124" y="339" width="34" height="34" rx="6" fill="rgb(122,174,237)" stroke="#ffffff" stroke-width="1.5"/>
<rect x="163" y="339" width="34" height="34" rx="6" fill="rgb(32,119,222)" stroke="#ffffff" stroke-width="1.5"/>
<rect x="202" y="339" width="34" height="34" rx="6" fill="#f1f5f9" stroke="#ffffff" stroke-width="1.5"/><path d="M210 347 L228 365 M228 347 L210 365" stroke="#cf222e" stroke-width="2" opacity=".55"/>
<rect x="124" y="378" width="34" height="34" rx="6" fill="rgb(189,215,248)" stroke="#ffffff" stroke-width="1.5"/>
